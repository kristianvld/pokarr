name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check for committed secrets
        run: docker run --rm --network none --cpus=1 --memory=512m -v "$PWD:/src:ro" ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f git /src --redact --no-banner

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.4"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Audit dependencies
        run: bun audit --audit-level=high

      - name: Run checks
        run: bun run check

      - name: Install Playwright browser
        run: bunx playwright install chromium

      - name: Smoke built UI
        run: bun run smoke:built

      - name: Run React Doctor
        run: |
          set -euo pipefail

          score="$(bun run doctor:score | tail -n 1)"
          echo "react-doctor score: ${score}"
          test "${score}" -ge 75

      - name: Docker smoke test
        run: |
          set -euo pipefail

          docker build -t pokarr:ci .
          container_id="$(docker run -d -p 127.0.0.1:3001:3000 pokarr:ci)"
          trap 'docker rm -f "${container_id}" >/dev/null 2>&1 || true' EXIT
          bun run smoke:built -- --url http://127.0.0.1:3001
